[technology-description]
planet-discovery-terrapalus=一颗黑暗潮湿的卫星，有无尽的沼泽、咬虫、五足兽和帕卢矿石。
palusium-processing=在熔炉里处理帕卢矿石制成帕卢板。
palusium-crushing=帕卢矿石可以粉碎成帕卢粉。
palusium-liquefaction=把帕卢粉和水、石油混合制成超紫液。
palusium-refining=把帕卢粉精炼成帕卢水晶。
inhibitor-lamp=利用帕卢水晶的紫外特性把敌人冻在原地。
inhibitor-lamp-mk2=升级版抑制灯，冰冻半径增加40%。
inhibitor-lamp-mk3=顶配版抑制灯，冰冻半径增加80%。
inhibitor-lamp-damage=攻击型灯，让敌人减速50%并持续造成伤害。
uv-turret=紫外炮塔用集中的紫外光束驱赶和迷惑敌人。
uv-turret-mk2=升级版紫外炮塔，射程和伤害更高。
uv-turret-mk3=高级紫外炮塔，最大射程和毁灭性伤害。
uv-turret-aoe=范围型紫外炮塔，伤害光束半径内的所有敌人。
uv-turret-chain=连锁型紫外炮塔，从主目标向附近敌人传播伤害。
uv-spotlight=快速瞄准的探照灯，冰冻敌人30秒然后切换下一个目标。纯控制型。
ultravium-power-systems=在没有太阳能的泰拉帕卢斯上利用超紫液能量为动力甲充电。
ultravium-power-systems-2=升级版超紫液能源系统，更大容量电池和更远射程充电站。
ultravium-power-systems-3=高级超紫液能源系统，最大容量能量电池和远程充电基础设施。
uv-personal-equipment=个人装甲用的微型紫外技术。包括让敌人逃跑的防御炮塔和冻结附近敌人的护盾。

