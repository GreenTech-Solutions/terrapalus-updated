[mod-setting-description]
inhibitor-freeze-duration=冰冻效果持续时间，单位tick。
inhibitor-thaw-duration=解冻效果持续时间，单位tick。
inhibitor-radius=抑制灯的半径/范围。
inhibitor-lamp-power-multiplier=抑制灯功耗倍数（1.0 = 默认值）。
surface-temperature=基础温度，单位摄氏度。
surface-temperature-variance=表面温度变化范围。
surface-pressure=决定能否建造人工土壤（需要>=2000 hPa）。
surface-gravity=表面重力强度。
surface-solar-power=太阳能效率百分比。
surface-magnetic-field=磁场强度。
freeze-daytime=把白天时间冻结在你设定的值。
daytime-value=白天时间值（0.5 = 午夜，1.0 = 正午）
day-night-cycle-minutes=完整昼夜循环的时长，单位分钟。
terrapalus-elevation-scale=控制丘陵和地形特征的大小。越大 = 特征越大。
terrapalus-biome-scale=控制生物群系的大小。越大 = 群系越大。
terrapalus-mud-basin-scale=控制泥潭的频率。越大 = 越少见。
terrapalus-lowland-size=控制泰拉帕卢斯沼泽/低地区域的大小。
terrapalus-moisture-threshold=地形生成的湿度阈值。
terrapalus-starting-area-multiplier=起始区域整体大小的倍数。
terrapalus-starting-distance=从出生点到起始低地的距离，单位格。
terrapalus-starting-radius=起始低地区域的半径，单位格。
terrapalus-starting-fertile-radius=起始肥沃土壤点的半径，单位格。
terrapalus-fertile-soil-frequency=控制肥沃土壤斑块出现的频率。
terrapalus-fertile-spot-radius=肥沃土壤点的半径，单位格。
terrapalus-fertile-spot-spacing=肥沃点之间的最小间距，单位格。
terrapalus-fertile-region-size=生成肥沃点的区域大小。
terrapalus-fertile-candidate-spots=每个区域的候选点数量。越多 = 越密集。
terrapalus-spawner-frequency=大型敌人刷怪点的频率。
terrapalus-spawner-size=大型刷怪点的大小倍数。
terrapalus-small-spawner-frequency=小型敌人刷怪点的频率。
terrapalus-small-spawner-size=小型刷怪点的大小倍数。
terrapalus-enemy-safe-zone-radius=出生点附近无敌人安全区的半径。
terrapalus-fog-opacity=雾气透明度（0 = 无，1 = 最大）。
terrapalus-fog-color-r=雾气颜色的红色分量（0-1）。
terrapalus-fog-color-g=雾气颜色的绿色分量（0-1）。
terrapalus-fog-color-b=雾气颜色的蓝色分量（0-1）。
terrapalus-cloud-opacity=云层透明度（0 = 无，1 = 最大）。
terrapalus-cloud-color-r=云层颜色的红色分量（0-1）。
terrapalus-cloud-color-g=云层颜色的绿色分量（0-1）。
terrapalus-cloud-color-b=云层颜色的蓝色分量（0-1）。

