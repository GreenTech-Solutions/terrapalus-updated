[item-description]
palusium-ore=帕卢矿石含有微小的紫外水晶，受热后会反应并激活。
palusium-plate=帕卢板是制造帕卢紫外科技的中间材料。
palusium-powder=帕卢粉是粉碎后的帕卢矿石，水晶更容易获取。
palusium-crystal=帕卢水晶在紫外光谱中有很多用途。
ultravium-battery=一块充满超紫液能量的紧凑电池。使用后为动力甲装备充电10 MJ。
ultravium-battery-pack=包含多个超紫液电芯的大型电池组。使用后为动力甲装备充电50 MJ。
ultravium-power-cell=使用精炼超紫液技术的高级大容量能量电池。使用后为动力甲装备充电200 MJ。
armor-charging-station=无线为附近的动力甲和载具充电。范围：15格。
armor-charging-station-mk2=升级版充电站，范围更远充电更快。范围：22格。
armor-charging-station-mk3=最大范围充电站，最高功率输出。范围：30格。
uv-defense-turret=发射紫外光束让敌人惊恐逃跑的个人防御炮塔。放在装甲装备栏里。
uv-personal-shield=紫外增强护盾，冰冻附近敌人并拦截10格内的飞掠者投射物。每次效果消耗能量。

