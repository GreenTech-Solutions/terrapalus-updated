[technology-description]
planet-discovery-terrapalus=Une lune sombre et humide avec des marécages sans fin, des mordeurs, des pentapodes et du minerai de Palusium.
palusium-processing=Le Palusium est traité dans un four pour faire des plaques de Palusium.
palusium-crushing=Le minerai de Palusium peut être broyé en poudre de Palusium.
palusium-liquefaction=Mélange la poudre de Palusium avec de l'eau et du pétrole pour faire de l'ultravium.
palusium-refining=Raffine la poudre de Palusium en cristaux de Palusium.
inhibitor-lamp=Utilise les propriétés UV des cristaux de Palusium pour geler les ennemis sur place.
inhibitor-lamp-mk2=Lampe inhibitrice améliorée avec 40% de rayon de gel en plus.
inhibitor-lamp-mk3=Lampe inhibitrice maximale avec 80% de rayon de gel en plus.
inhibitor-lamp-damage=Variante offensive qui ralentit les ennemis de 50% et fait des dégâts au fil du temps.
uv-turret=Les tourelles UV utilisent des rayons de lumière UV concentrée pour repousser et désorienter les ennemis.
uv-turret-mk2=Tourelle UV améliorée avec portée et dégâts accrus.
uv-turret-mk3=Tourelle UV avancée avec portée maximale et dégâts dévastateurs.
uv-turret-aoe=Tourelle UV de zone qui touche tous les ennemis dans le rayon du faisceau.
uv-turret-chain=Tourelle UV en chaîne qui propage les dégâts aux ennemis proches de la cible principale.
uv-spotlight=Projecteur rapide qui gèle les ennemis pendant 30 secondes puis passe au suivant. Pur contrôle de foule.
ultravium-power-systems=Exploite l'énergie de l'Ultravium pour recharger les armures sur Terra Palus où l'énergie solaire n'est pas disponible.
ultravium-power-systems-2=Systèmes d'énergie Ultravium améliorés avec des batteries de plus grande capacité et des stations de charge à portée étendue.
ultravium-power-systems-3=Systèmes d'énergie Ultravium avancés avec des cellules de capacité maximale et une infrastructure de charge longue portée.
uv-personal-equipment=Technologie UV miniaturisée pour armure personnelle. Comprend une tourelle défensive qui fait fuir les ennemis et un bouclier qui gèle les hostiles proches.

