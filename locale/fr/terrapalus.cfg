uv-defense-turret=Une tourelle défensive personnelle améliorée avec la technologie UV. Les ennemis touchés par ses rayons fuiront terrorisés.
uv-personal-shield=Un bouclier personnel amélioré UV qui gèle les ennemis et intercepte les projectiles de Strafer dans un rayon de 10 tuiles. Consomme 20 kJ par gel, 5 kJ par projectile.

[fluid-name]
ultravium=Ultravium

[fluid-description]
ultravium=Une forme liquide énergétique et active de cristaux de Palusium, créée dans les marécages de Terra Palus.
