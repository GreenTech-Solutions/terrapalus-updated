[item-description]
palusium-ore=Le minerai de Palusium contient de minuscules cristaux UV qui réagissent et s'activent sous la chaleur.
palusium-plate=Les plaques de Palusium sont un matériau intermédiaire pour construire la technologie UV au Palusium.
palusium-powder=La poudre de Palusium est du minerai broyé avec des cristaux de palusium accessibles.
palusium-crystal=Le cristal de Palusium a plein d'applications dans le spectre ultraviolet.
ultravium-battery=Une batterie compacte chargée d'énergie Ultravium. Utiliser pour recharger l'équipement d'armure avec 10 MJ.
ultravium-battery-pack=Un pack de batteries plus grand contenant plusieurs cellules Ultravium. Utiliser pour recharger l'équipement d'armure avec 50 MJ.
ultravium-power-cell=Une cellule d'énergie avancée haute capacité utilisant la technologie Ultravium raffinée. Utiliser pour recharger l'équipement d'armure avec 200 MJ.
armor-charging-station=Recharge sans fil les armures et véhicules à proximité. Portée : 15 tuiles.
armor-charging-station-mk2=Station de charge améliorée avec portée étendue et charge plus rapide. Portée : 22 tuiles.
armor-charging-station-mk3=Station de charge à portée maximale avec la plus haute puissance. Portée : 30 tuiles.
uv-defense-turret=Une tourelle défensive personnelle qui émet des rayons UV faisant fuir les ennemis terrorisés. Placer dans la grille d'équipement d'armure.
uv-personal-shield=Un bouclier amélioré UV qui gèle les ennemis proches et intercepte les projectiles de Strafer dans un rayon de 10 tuiles. Consomme de l'énergie par effet.

