[entity-description]
inhibitor-lamp=Émet une lumière UV qui provoque une réaction neurologique chez les ennemis qui les gèle tant que la lampe est allumée.
inhibitor-lamp-mk2=Lampe inhibitrice améliorée avec 40% de rayon de gel en plus.
inhibitor-lamp-mk3=Lampe inhibitrice maximale avec 80% de rayon de gel en plus et efficacité maximale.
inhibitor-lamp-damage=Lampe offensive qui émet des radiations UV nocives. Ralentit les ennemis de 50% et fait 5 dégâts par tick.
palusium-ore=Un minerai cristallisé bleu-violet foncé qui brille dans le noir.
uv-turret=Les tourelles UV utilisent des rayons de lumière UV concentrée pour repousser et désorienter les ennemis.
uv-turret-mk2=Tourelle UV améliorée avec portée étendue (35 tuiles) et dégâts accrus.
uv-turret-mk3=Tourelle UV de puissance maximale avec portée étendue (42 tuiles) et dégâts maximaux.
uv-turret-aoe=Tourelle UV de zone qui touche tous les ennemis dans un rayon de 6 tuiles de l'impact.
uv-turret-chain=Tourelle UV en chaîne. La cible principale prend 20 dégâts, les ennemis proches dans 8 tuiles prennent 12.
uv-spotlight=Projecteur rapide qui marque les ennemis avec un gel de 30 secondes puis passe au suivant. Dégâts minimaux, pur contrôle.
armor-charging-station=Recharge sans fil les armures et véhicules dans un rayon de 15 tuiles. Ne consomme de l'énergie que lors de la charge active.
armor-charging-station-mk2=Station de charge améliorée avec portée de 22 tuiles et taux de charge de 2 MW.
armor-charging-station-mk3=Station de charge avancée avec portée de 30 tuiles et taux de charge de 4 MW.

