[item-description]
palusium-ore=Руда палузия содержит крошечные УФ-кристаллы, которые реагируют и активируются при нагреве.
palusium-plate=Пластины палузия — промежуточный компонент для УФ-технологий палузия.
palusium-powder=Порошок палузия — это дроблёная руда с легкодоступными кристаллами.
palusium-crystal=Кристалл палузия имеет кучу применений в ультрафиолетовом спектре.
ultravium-battery=Компактная батарея с энергией ультравиума. Используй для зарядки оборудования брони на 10 МДж.
ultravium-battery-pack=Большой батарейный блок с несколькими ультравиумными ячейками. Используй для зарядки оборудования брони на 50 МДж.
ultravium-power-cell=Продвинутая энергоячейка высокой ёмкости на очищенном ультравиуме. Используй для зарядки оборудования брони на 200 МДж.
armor-charging-station=Беспроводная зарядка силовой брони и техники поблизости. Дальность: 15 тайлов.
armor-charging-station-mk2=Улучшенная зарядная станция с увеличенной дальностью и скоростью зарядки. Дальность: 22 тайла.
armor-charging-station-mk3=Зарядная станция максимальной дальности с наивысшей мощностью. Дальность: 30 тайлов.
uv-defense-turret=Персональная оборонительная турель, излучающая УФ-лучи, заставляющие врагов бежать в ужасе. Размести в сетке оборудования брони.
uv-personal-shield=УФ-усиленный щит, замораживающий ближайших врагов и перехватывающий снаряды Страйферов в радиусе 10 тайлов. Потребляет энергию за каждый эффект.

