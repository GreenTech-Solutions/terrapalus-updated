uv-turret-chain=Цепная УФ турель. Основная цель получает 20 урона, ближайшие враги в 8 тайлах — 12.
uv-spotlight=Быстрый прожектор, метящий врагов 30-секундной заморозкой и переключающийся на следующего. Минимум урона, чистый контроль.
armor-charging-station=Беспроводная зарядка силовой брони и техники в радиусе 15 тайлов. Потребляет энергию только при активной зарядке.
