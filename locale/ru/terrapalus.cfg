[technology-description]
planet-discovery-terrapalus=Тёмная, сырая луна с бесконечными болотами, кусаками, пентаподами и палузиевой рудой.
palusium-processing=Палузий плавится в печи для получения палузиевых пластин.
palusium-crushing=Палузиевую руду можно раздробить в палузиевый порошок.
palusium-liquefaction=Смешай палузиевый порошок с водой и нефтью для ультравиума.
palusium-refining=Очистка палузиевого порошка в кристаллы палузия.
inhibitor-lamp=Используй УФ-свойства кристаллов палузия чтобы заморозить врагов на месте.
inhibitor-lamp-mk2=Улучшенная подавляющая лампа с радиусом заморозки на 40% больше.
inhibitor-lamp-mk3=Максимальная подавляющая лампа с радиусом заморозки на 80% больше.
inhibitor-lamp-damage=Боевая лампа, замедляющая врагов на 50% и наносящая урон со временем.
uv-turret=УФ турели используют лучи концентрированного УФ-света чтобы отпугивать и путать врагов.
uv-turret-mk2=Улучшенная УФ турель с увеличенной дальностью и уроном.
uv-turret-mk3=Продвинутая УФ турель с максимальной дальностью и разрушительным уроном.
uv-turret-aoe=УФ турель по площади, бьющая всех врагов в радиусе луча.
uv-turret-chain=Цепная УФ турель, распространяющая урон на ближайших врагов от основной цели.
uv-spotlight=Быстрый прожектор, замораживающий врагов на 30 секунд и переключающийся на следующую цель. Чистый контроль толпы.
ultravium-power-systems=Используй энергию ультравиума для зарядки силовой брони на Терра Палус, где нет солнечной энергии.
ultravium-power-systems-2=Улучшенные энергосистемы на ультравиуме с батареями большей ёмкости и зарядными станциями увеличенной дальности.
ultravium-power-systems-3=Продвинутые энергосистемы на ультравиуме с энергоячейками максимальной ёмкости и инфраструктурой дальней зарядки.
uv-personal-equipment=Миниатюрная УФ технология для персональной брони. Включает оборонительную турель, заставляющую врагов бежать, и щит, замораживающий ближайших противников.

