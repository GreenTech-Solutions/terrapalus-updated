inhibitor-lamp=Излучает УФ-свет, вызывающий неврологическую реакцию у врагов, замораживая их пока лампа работает.
inhibitor-lamp-mk2=Улучшенная подавляющая лампа с радиусом заморозки на 40% больше.
inhibitor-lamp-mk3=Максимальная подавляющая лампа с радиусом заморозки на 80% больше и максимальной эффективностью.
inhibitor-lamp-damage=Боевая лампа, излучающая вредное УФ-излучение. Замедляет врагов на 50% и наносит 5 урона за тик.
palusium-ore=Грубая, кристаллизованная тёмно-сине-фиолетовая руда, светящаяся в темноте.
