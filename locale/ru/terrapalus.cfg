terrapalus-cloud-color-g=Зелёный компонент цвета облаков (0-1).
terrapalus-cloud-color-b=Синий компонент цвета облаков (0-1).
terrapalus-uranium-ore=На Terra Palus генерируются залежи урановой руды, как на Nauvis. По умолчанию выключено.\nЕсли включить в сейве, где Terra Palus уже есть, залежи появятся и в открытых областях без построек. Если выключить, в новых областях их не будет, а созданные останутся.
terrapalus-stromatolites=На Terra Palus генерируются железные и медные строматолиты, как на Gleba, и технологии бактерий можно изучить там. По умолчанию выключено.\nЕсли включить в сейве, где Terra Palus уже есть, строматолиты появятся и в открытых областях без построек. Если выключить, в новых областях их не будет, а созданные останутся.

