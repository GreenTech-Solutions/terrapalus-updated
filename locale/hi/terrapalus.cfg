[technology-description]
planet-discovery-terrapalus=एक अंधेरा, नम चंद्रमा जहां अनंत दलदल, काटने वाले, पेंटापोड और पैलुसियम अयस्क है।
palusium-processing=पैलुसियम को भट्टी में प्रोसेस करके पैलुसियम प्लेट बनाओ।
palusium-crushing=पैलुसियम अयस्क को क्रश करके पैलुसियम पाउडर बनाया जा सकता है।
palusium-liquefaction=पैलुसियम पाउडर को पानी और तेल के साथ मिलाकर अल्ट्राविम बनाओ।
palusium-refining=पैलुसियम पाउडर को रिफाइन करके पैलुसियम क्रिस्टल बनाओ।
inhibitor-lamp=पैलुसियम क्रिस्टल की UV प्रॉपर्टीज का इस्तेमाल करके दुश्मनों को जगह पर फ्रीज करो।
inhibitor-lamp-mk2=बेहतर इनहिबिटर लैंप, 40% ज्यादा फ्रीज रेडियस।
inhibitor-lamp-mk3=मैक्सिमम इनहिबिटर लैंप, 80% ज्यादा फ्रीज रेडियस।
inhibitor-lamp-damage=अटैक वाला लैंप जो दुश्मनों को 50% स्लो करता है और समय के साथ डैमेज देता है।
uv-turret=UV टरेट कंसेंट्रेटेड UV लाइट बीम से दुश्मनों को भगाती और कन्फ्यूज करती है।
uv-turret-mk2=बेहतर UV टरेट, ज्यादा रेंज और डैमेज।
uv-turret-mk3=एडवांस UV टरेट, मैक्सिमम रेंज और तबाही मचाने वाला डैमेज।
uv-turret-aoe=एरिया-इफेक्ट UV टरेट जो बीम रेडियस में सभी दुश्मनों को डैमेज करती है।
uv-turret-chain=चेन-डैमेज UV टरेट जो मुख्य टारगेट से पास के दुश्मनों में डैमेज फैलाती है।
uv-spotlight=तेज-टारगेटिंग स्पॉटलाइट जो दुश्मनों को 30 सेकंड फ्रीज करती है फिर अगले टारगेट पर जाती है। पूरा क्राउड कंट्रोल।
ultravium-power-systems=टेरा पैलस पर अल्ट्राविम की ऊर्जा का इस्तेमाल करके पावर आर्मर चार्ज करो जहां सोलर पावर उपलब्ध नहीं है।
ultravium-power-systems-2=बेहतर अल्ट्राविम पावर सिस्टम, ज्यादा कैपेसिटी बैटरी और एक्सटेंडेड रेंज चार्जिंग स्टेशन।
ultravium-power-systems-3=एडवांस अल्ट्राविम पावर सिस्टम, मैक्सिमम कैपेसिटी पावर सेल और लॉन्ग-रेंज चार्जिंग इंफ्रास्ट्रक्चर।
uv-personal-equipment=पर्सनल आर्मर के लिए मिनिएचराइज्ड UV टेक्नोलॉजी। इसमें एक डिफेंस टरेट है जो दुश्मनों को भगाती है और एक शील्ड जो पास के दुश्मनों को फ्रीज करती है।

