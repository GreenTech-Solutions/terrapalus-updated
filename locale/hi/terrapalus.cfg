terrapalus-fertile-spot-radius=उपजाऊ स्पॉट का रेडियस टाइल्स में।
terrapalus-fertile-spot-spacing=उपजाऊ स्पॉट के बीच मिनिमम स्पेसिंग टाइल्स में।
terrapalus-fertile-region-size=उपजाऊ स्पॉट जनरेशन के लिए क्षेत्र का आकार।
terrapalus-fertile-candidate-spots=प्रति क्षेत्र कैंडिडेट स्पॉट की संख्या। ज्यादा = ज्यादा घना।
