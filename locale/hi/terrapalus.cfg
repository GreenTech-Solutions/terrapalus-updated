[item-description]
palusium-ore=पैलुसियम अयस्क में छोटे UV क्रिस्टल होते हैं जो गर्मी में रिएक्ट और एक्टिवेट होते हैं।
palusium-plate=पैलुसियम प्लेट पैलुसियम UV टेक्नोलॉजी बनाने में इस्तेमाल होने वाला इंटरमीडिएट आइटम है।
palusium-powder=पैलुसियम पाउडर क्रश किया हुआ अयस्क है जिसमें आसानी से मिलने वाले क्रिस्टल हैं।
palusium-crystal=पैलुसियम क्रिस्टल के अल्ट्रावायलेट लाइट स्पेक्ट्रम में कई उपयोग हैं।
ultravium-battery=एक कॉम्पैक्ट बैटरी जो अल्ट्राविम एनर्जी से भरी है। पावर आर्मर इक्विपमेंट को 10 MJ से चार्ज करने के लिए इस्तेमाल करो।
ultravium-battery-pack=एक बड़ा बैटरी पैक जिसमें कई अल्ट्राविम सेल हैं। पावर आर्मर इक्विपमेंट को 50 MJ से चार्ज करने के लिए इस्तेमाल करो।
ultravium-power-cell=एक एडवांस हाई-कैपेसिटी पावर सेल जो रिफाइंड अल्ट्राविम टेक्नोलॉजी इस्तेमाल करता है। पावर आर्मर इक्विपमेंट को 200 MJ से चार्ज करने के लिए इस्तेमाल करो।
armor-charging-station=पास के पावर आर्मर और वाहनों को वायरलेस चार्ज करता है। रेंज: 15 टाइल्स।
armor-charging-station-mk2=बेहतर चार्जिंग स्टेशन, एक्सटेंडेड रेंज और तेज चार्जिंग। रेंज: 22 टाइल्स।
armor-charging-station-mk3=मैक्सिमम रेंज चार्जिंग स्टेशन, सबसे ज्यादा पावर आउटपुट। रेंज: 30 टाइल्स।
uv-defense-turret=एक पर्सनल डिफेंस टरेट जो UV बीम एमिट करती है जिससे दुश्मन डरकर भागते हैं। आर्मर इक्विपमेंट ग्रिड में रखो।
uv-personal-shield=एक UV-एन्हांस्ड शील्ड जो पास के दुश्मनों को फ्रीज करती है और 10 टाइल्स के अंदर Strafer प्रोजेक्टाइल इंटरसेप्ट करती है। हर इफेक्ट पर एनर्जी खर्च होती है।

