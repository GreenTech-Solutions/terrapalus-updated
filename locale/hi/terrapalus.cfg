inhibitor-lamp=UV लाइट की एक वेवलेंथ एमिट करता है जो दुश्मनों में न्यूरोलॉजिकल रिएक्शन पैदा करती है और जब तक लैंप ऑन है उन्हें फ्रीज रखती है।
inhibitor-lamp-mk2=बेहतर इनहिबिटर लैंप, 40% ज्यादा फ्रीज रेडियस।
inhibitor-lamp-mk3=मैक्सिमम इनहिबिटर लैंप, 80% ज्यादा फ्रीज रेडियस और मैक्सिमम एफिशिएंसी।
inhibitor-lamp-damage=अटैक लैंप जो हानिकारक UV रेडिएशन एमिट करता है। दुश्मनों को 50% स्लो करता है और हर टिक 5 डैमेज देता है।
palusium-ore=एक रफ, क्रिस्टलाइज्ड गहरे नीले-बैंगनी रंग का अयस्क जो अंधेरे में चमकता है।
uv-turret=UV टरेट कंसेंट्रेटेड UV लाइट बीम से दुश्मनों को भगाती और कन्फ्यूज करती है।
uv-turret-mk2=बेहतर UV टरेट, ज्यादा रेंज (35 टाइल्स) और डैमेज।
uv-turret-mk3=मैक्सिमम पावर UV टरेट, एक्सटेंडेड रेंज (42 टाइल्स) और सबसे ज्यादा डैमेज।
uv-turret-aoe=एरिया-इफेक्ट UV टरेट जो इम्पैक्ट के 6 टाइल रेडियस में सभी दुश्मनों को डैमेज करती है।
uv-turret-chain=चेन-डैमेज UV टरेट। मुख्य टारगेट को 20 डैमेज, 8 टाइल्स के अंदर पास के दुश्मनों को 12 डैमेज।
uv-spotlight=तेज-टारगेटिंग स्पॉटलाइट जो दुश्मनों को 30-सेकंड फ्रीज के साथ टैग करती है फिर अगले टारगेट पर जाती है। मिनिमम डैमेज, पूरा कंट्रोल।
armor-charging-station=15 टाइल रेडियस में पावर आर्मर और वाहनों को वायरलेस चार्ज करता है। सिर्फ एक्टिव चार्जिंग के दौरान पावर खींचता है।
armor-charging-station-mk2=बेहतर चार्जिंग स्टेशन, 22 टाइल रेंज और 2 MW चार्जिंग रेट।
armor-charging-station-mk3=एडवांस चार्जिंग स्टेशन, 30 टाइल रेंज और 4 MW चार्जिंग रेट।

