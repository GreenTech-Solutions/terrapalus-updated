[technology-description]
planet-discovery-terrapalus=Una luna oscura y húmeda con pantanos interminables, mordedores, pentápodos y mineral de Palusio.
palusium-processing=El Palusio se procesa en un horno para hacer placas de Palusio.
palusium-crushing=El mineral de Palusio se puede triturar en polvo de Palusio.
palusium-liquefaction=Mezcla polvo de Palusio con agua y petróleo para hacer ultravium.
palusium-refining=Refina el polvo de Palusio en cristales de Palusio.
inhibitor-lamp=Usa las propiedades UV de los cristales de Palusio para congelar enemigos en su lugar.
inhibitor-lamp-mk2=Lámpara inhibidora mejorada con 40% más radio de congelamiento.
inhibitor-lamp-mk3=Lámpara inhibidora máxima con 80% más radio de congelamiento.
inhibitor-lamp-damage=Variante ofensiva que ralentiza enemigos al 50% y hace daño con el tiempo.
uv-turret=Las torretas UV usan rayos de luz UV concentrada para repeler y confundir enemigos.
uv-turret-mk2=Torreta UV mejorada con mayor alcance y daño.
uv-turret-mk3=Torreta UV avanzada con alcance máximo y daño devastador.
uv-turret-aoe=Torreta UV de área que daña a todos los enemigos en el radio del rayo.
uv-turret-chain=Torreta UV en cadena que propaga daño a enemigos cercanos del objetivo principal.
uv-spotlight=Reflector rápido que congela enemigos por 30 segundos y cambia al siguiente. Puro control de masas.
ultravium-power-systems=Aprovecha la energía del Ultravium para cargar armaduras en Terra Palus donde no hay energía solar.
ultravium-power-systems-2=Sistemas de energía Ultravium mejorados con baterías de mayor capacidad y estaciones de carga de mayor alcance.
ultravium-power-systems-3=Sistemas de energía Ultravium avanzados con celdas de máxima capacidad e infraestructura de carga de largo alcance.
uv-personal-equipment=Tecnología UV miniaturizada para armaduras personales. Incluye una torreta defensiva que hace huir a los enemigos y un escudo que congela hostiles cercanos.

