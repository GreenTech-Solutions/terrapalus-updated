terrapalus-fertile-spot-spacing=Espaciado mínimo entre manchas fértiles en tiles.
terrapalus-fertile-region-size=Tamaño de regiones para generar manchas fértiles.
terrapalus-fertile-candidate-spots=Número de manchas candidatas por región. Mayor = más denso.
terrapalus-spawner-frequency=Frecuencia de generadores grandes de enemigos.
