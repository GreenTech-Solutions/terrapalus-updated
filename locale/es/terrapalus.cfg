[entity-description]
inhibitor-lamp=Emite luz UV que causa una reacción neurológica en enemigos que los congela mientras la lámpara está encendida.
inhibitor-lamp-mk2=Lámpara inhibidora mejorada con 40% más radio de congelamiento.
inhibitor-lamp-mk3=Lámpara inhibidora máxima con 80% más radio de congelamiento y eficiencia máxima.
inhibitor-lamp-damage=Lámpara ofensiva que emite radiación UV dañina. Ralentiza enemigos al 50% y hace 5 de daño por tick.
palusium-ore=Un mineral cristalizado azul-púrpura oscuro que brilla en la oscuridad.
uv-turret=Las torretas UV usan rayos de luz UV concentrada para repeler y confundir enemigos.
uv-turret-mk2=Torreta UV mejorada con mayor alcance (35 tiles) y daño.
uv-turret-mk3=Torreta UV de máxima potencia con alcance extendido (42 tiles) y daño máximo.
uv-turret-aoe=Torreta UV de área que daña a todos los enemigos en un radio de 6 tiles del impacto.
uv-turret-chain=Torreta UV en cadena. El objetivo principal recibe 20 de daño, enemigos cercanos en 8 tiles reciben 12.
uv-spotlight=Reflector rápido que marca enemigos con congelamiento de 30 segundos y cambia al siguiente. Mínimo daño, puro control.
armor-charging-station=Carga armaduras y vehículos de forma inalámbrica en un radio de 15 tiles. Solo consume energía cuando está cargando activamente.
armor-charging-station-mk2=Estación de carga mejorada con alcance de 22 tiles y velocidad de carga de 2 MW.
armor-charging-station-mk3=Estación de carga avanzada con alcance de 30 tiles y velocidad de carga de 4 MW.

