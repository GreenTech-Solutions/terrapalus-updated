terrapalus-biome-scale=Controla el tamaño de los biomas. Mayor = biomas más grandes.
terrapalus-mud-basin-scale=Controla la frecuencia de cuencas de lodo. Mayor = menos frecuentes.
terrapalus-lowland-size=Controla el tamaño de pantanos/tierras bajas en Terra Palus.
