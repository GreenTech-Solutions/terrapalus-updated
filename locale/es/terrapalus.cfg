[item-description]
palusium-ore=El mineral de Palusio tiene pequeños cristales UV que reaccionan y se activan con el calor.
palusium-plate=Las placas de Palusio son un material intermedio para construir tecnología UV de Palusio.
palusium-powder=El polvo de Palusio es mineral triturado con cristales de palusio accesibles.
palusium-crystal=El cristal de Palusio tiene un montón de usos en el espectro ultravioleta.
ultravium-battery=Una batería compacta con energía Ultravium. Usa para cargar equipo de armadura con 10 MJ.
ultravium-battery-pack=Un pack de baterías más grande con múltiples celdas de Ultravium. Usa para cargar equipo de armadura con 50 MJ.
ultravium-power-cell=Una celda de energía avanzada de alta capacidad con tecnología Ultravium refinada. Usa para cargar equipo de armadura con 200 MJ.
armor-charging-station=Carga armaduras y vehículos cercanos de forma inalámbrica. Alcance: 15 tiles.
armor-charging-station-mk2=Estación de carga mejorada con mayor alcance y carga más rápida. Alcance: 22 tiles.
armor-charging-station-mk3=Estación de carga de máximo alcance con la mayor potencia. Alcance: 30 tiles.
uv-defense-turret=Una torreta defensiva personal que emite rayos UV haciendo que los enemigos huyan aterrorizados. Coloca en la rejilla de equipo de armadura.
uv-personal-shield=Un escudo mejorado con UV que congela enemigos cercanos e intercepta proyectiles de Strafer en 10 tiles. Consume energía por efecto.

