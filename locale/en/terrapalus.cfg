[entity-description]
inhibitor-lamp=Emits a wavelength of UV light causing a neurological response in enemies that freezes them while the lamp is powered.
inhibitor-lamp-mk2=Extended range inhibitor lamp with 40% increased freeze radius.
inhibitor-lamp-mk3=Maximum range inhibitor lamp with 80% increased freeze radius and maximum efficiency.
inhibitor-lamp-damage=Offensive lamp that emits harmful UV radiation. Slows enemies by 50% and deals 5 damage per tick.
palusium-ore=A rough, crystalised deep blue-purple ore that glows in the dark.
uv-turret=UV turrets use beams of concentrated UV light to repel and confuse some enemies.
uv-turret-mk2=Enhanced UV turret with improved range (35 tiles) and damage.
uv-turret-mk3=Maximum power UV turret with extended range (42 tiles) and highest damage output.
uv-turret-aoe=Area-effect UV turret that damages all enemies within a 6 tile radius of impact.
uv-turret-chain=Chain-damage UV turret. Primary target takes 20 damage, nearby enemies within 8 tiles take 12 damage.
uv-spotlight=Rapid-targeting spotlight that quickly tags enemies with a 30-second freeze then switches to the next target. Minimal damage, pure crowd control utility.
armor-charging-station=Wirelessly charges power armor and vehicle equipment grids within a 15 tile radius. Only draws power when actively charging.
armor-charging-station-mk2=Enhanced charging station with 22 tile range and 2 MW charging rate.
armor-charging-station-mk3=Advanced charging station with 30 tile range and 4 MW charging rate.

