[technology-description]
planet-discovery-terrapalus=A dark, dank moon with endless swamps, biters, pentapods and Palusium ore.
palusium-processing=Palusium is processed in a furnace to become Palusium plates.
palusium-crushing=Palusium ore can be crushed into Palusium powder.
palusium-liquefaction=Mix Palusium powder with water and oil to make ultravium.
palusium-refining=Refine Palusium powder into Palusium crystals.
inhibitor-lamp=Utilise the UV properties of Palusium crystals to freeze enemies in place.
inhibitor-lamp-mk2=Extended range inhibitor lamp with 40% increased freeze radius.
inhibitor-lamp-mk3=Maximum range inhibitor lamp with 80% increased freeze radius.
inhibitor-lamp-damage=Offensive lamp variant that slows enemies by 50% and deals damage over time.
uv-turret=UV turrets use beams of concentrated UV light to repel and confuse some enemies.
uv-turret-mk2=Improved UV turret with extended range and higher damage output.
uv-turret-mk3=Advanced UV turret with maximum range and devastating damage.
uv-turret-aoe=Area-effect UV turret that damages all enemies within its beam radius.
uv-turret-chain=Chain-damage UV turret that spreads damage to nearby enemies from primary target.
uv-spotlight=Rapid-targeting spotlight that freezes enemies for 30 seconds then switches to next target. Pure crowd control.
ultravium-power-systems=Harness the energy of Ultravium to charge power armor on Terra Palus where solar power is unavailable.
ultravium-power-systems-2=Improved Ultravium power systems with higher capacity batteries and extended range charging stations.
ultravium-power-systems-3=Advanced Ultravium power systems with maximum capacity power cells and long-range charging infrastructure.
uv-personal-equipment=Miniaturised UV technology for personal armor. Includes a defense turret that causes enemies to flee and a shield that freezes nearby hostiles.

