[item-description]
palusium-ore=Palusium ore houses tiny UV crystals that react and activate under heat.
palusium-plate=Palusium plates are an intermediary item used in the construction of Palusium UV technology.
palusium-powder=Palusium powder is crushed Palusium ore with easily accessible palusium crystals.
palusium-crystal=Palusium crystal has a variety of applicable uses in the ultraviolet light spectrum.
ultravium-battery=A compact battery infused with Ultravium energy. Use to charge power armor equipment with 10 MJ.
ultravium-battery-pack=A larger battery pack containing multiple Ultravium cells. Use to charge power armor equipment with 50 MJ.
ultravium-power-cell=An advanced high-capacity power cell utilizing refined Ultravium technology. Use to charge power armor equipment with 200 MJ.
armor-charging-station=Charges nearby power armor and vehicle equipment grids wirelessly. Range: 15 tiles.
armor-charging-station-mk2=Enhanced charging station with extended range and faster charging. Range: 22 tiles.
armor-charging-station-mk3=Maximum range charging station with the highest power output. Range: 30 tiles.
uv-defense-turret=A personal defense turret that emits UV beams causing enemies to flee in terror. Place in armor equipment grid.
uv-personal-shield=A UV-enhanced shield that freezes nearby enemies and intercepts Strafer projectiles within 10 tiles. Consumes energy per effect.

