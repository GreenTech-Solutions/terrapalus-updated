inhibitor-freeze-duration=Czas trwania efektu zamrażającego w tikach.
inhibitor-thaw-duration=Czas trwania efektu zamrażającego w tikach.
inhibitor-radius=Promień/zasięg lamp inhibitorów.
inhibitor-lamp-power-multiplier=Mnożnik zużycia energii przez lampy inhibitorów (1,0 = domyślnie).
