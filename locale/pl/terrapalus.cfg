[entity-description]
inhibitor-lamp=Emituje promieniowanie UV o określonej długości fali, wywołujące u wrogów reakcję neurologiczną, która unieruchamia ich na czas działania lampy.
inhibitor-lamp-mk2=Lampa hamująca o zwiększonym zasięgu, z promieniem unieruchomienia większym o 40%.
inhibitor-lamp-mk3=Lampa hamująca o maksymalnym zasięgu, z promieniem unieruchomienia większym o 80% i maksymalną skutecznością.
inhibitor-lamp-damage=Lampa ofensywna emitująca szkodliwe promieniowanie UV. Spowalnia wrogów o 50% i zadaje 5 punktów obrażeń na tick.
palusium-ore=Surowa, skrystalizowana ruda o głębokim niebiesko-fioletowym kolorze, świecąca w ciemności.
uv-turret=Wieżyczki UV wykorzystują wiązki skoncentrowanego światła UV do odpierania i dezorientowania niektórych wrogów.
uv-turret-mk2=Ulepszona wieżyczka UV o zwiększonym zasięgu (35 pól) i obrażeniach.
uv-turret-mk3=Wieżyczka UV o maksymalnej mocy, z rozszerzonym zasięgiem (42 pola) i najwyższą siłą rażenia.
uv-turret-aoe=Wieżyczka UV o obszarowym działaniu, która zadaje obrażenia wszystkim wrogom w promieniu 6 pól od punktu uderzenia.
uv-turret-chain=Wieżyczka UV zadająca obrażenia łańcuchowe. Główny cel otrzymuje 20 punktów obrażeń, a pobliskie wrogie jednostki w promieniu 8 kafelków otrzymują 12 punktów obrażeń.
uv-spotlight=Reflektor szybkiego namierzania, który błyskawicznie oznaczy wrogów 30-sekundowym zamrożeniem, a następnie przechodzi do następnego celu. Minimalne obrażenia, czysta funkcja kontroli tłumu.
armor-charging-station=Bezprzewodowo ładuje zbroje wspomagane i siatki wyposażenia pojazdów w promieniu 15 kafelków. Pobiera energię tylko podczas aktywnego ładowania.
armor-charging-station-mk2=Ulepszona stacja ładująca o zasięgu 22 kafelków i mocy ładowania 2 MW.
armor-charging-station-mk3=Zaawansowana stacja ładująca o zasięgu 30 kafelków i mocy ładowania 4 MW.

