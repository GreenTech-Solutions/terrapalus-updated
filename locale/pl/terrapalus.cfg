[equipment-description]
uv-defense-turret=Wieżyczka do obrony osobistej wzbogacona o technologię UV. Wrogowie trafieni jej promieniami uciekną w przerażeniu.
uv-personal-shield=Osobista tarcza wzbogacona o promieniowanie UV, która zamraża wrogów i przechwytuje pociski Straferów w promieniu 10 kafelków. Zużywa 20 kJ na zamrożenie, 5 kJ na pocisk.

[fluid-name]
ultravium=Ultravium

[fluid-description]
ultravium=Energetyczna i aktywna płynna forma kryształów palusium, stworzona z bagien Terra Palus.
