[item-description]
palusium-ore=Ruda palusium zawiera maleńkie kryształy UV, które reagują i aktywują się pod wpływem ciepła.
palusium-plate=Płytka palusiumowa jest elementem pośrednim wykorzystywanym do budowy technologii UV opartej na palusium.
palusium-powder=Proszek palusiumowy to rozdrobniona ruda palusium z łatwo dostępnymi kryształami palusium.
palusium-crystal=Kryształ palusiumowy ma wiele zastosowań w zakresie promieniowania ultrafioletowego.
ultravium-battery=Kompaktowy akumulator zasilany energią Ultravium. Służy do ładowania elementów zbroi wspomaganej energią o mocy 10 MJ.
ultravium-battery-pack=Większy zestaw akumulatorów zawierający wiele ogniw Ultravium. Służy do ładowania elementów zbroi wspomaganej energią o mocy 50 MJ.
ultravium-power-cell=Zaawansowane ogniwo o dużej pojemności, wykorzystujące udoskonaloną technologię Ultravium. Służy do ładowania wyposażenia zbroi wspomaganej o 200 MJ.
armor-charging-station=Ładuje bezprzewodowo pobliskie pola wyposażenia zbroi wspomaganej i pojazdów. Zasięg: 15 pól.
armor-charging-station-mk2=Ulepszona stacja ładująca o zwiększonym zasięgu i szybszym ładowaniu. Zasięg: 22 pola.
armor-charging-station-mk3=Stacja ładująca o maksymalnym zasięgu i najwyższej mocy wyjściowej. Zasięg: 30 kafelków.
uv-defense-turret=Osobista wieżyczka obronna, która emituje promienie UV, powodując ucieczkę wrogów w przerażeniu. Umieść w polu wyposażenia zbroi.
uv-personal-shield=Tarcza wzmocniona promieniowaniem UV, która zamraża pobliskich wrogów i przechwytuje pociski Straferów w promieniu 10 kafelków. Zużywa energię na każdy efekt.

