[recipe-description]
palusium-processing=Wytop rudy palusium w celu uzyskania płytek palusiumowych.
palusium-crushing=Zmiel rudę palusium na proszek palusium, z którego można wytworzyć kryształy palusium.
palusium-liquefaction=Wymieszaj proszek palusium z wodą i olejem, aby uzyskać ultravium.
palusium-refining=Przetwórz proszek palusium w kryształy palusium.
ultravium-battery=Stwórz przenośną baterię ultravium do awaryjnego ładowania zbroi.
ultravium-battery-pack=Połącz wiele baterii w większy zestaw zasilający.
ultravium-power-cell=Stwórz ogniwo zasilające o dużej pojemności do długotrwałej pracy.
armor-charging-station=Zbuduj bezprzewodową stację ładowania zbroi wspomaganej.
armor-charging-station-mk2=Ulepsz stację ładowania do wersji o zwiększonym zasięgu.
armor-charging-station-mk3=Zbuduj najpotężniejszą stację ładowania zbroi.
uv-defense-turret=Połącz technologię UV z osobistym sprzętem obronnym.
uv-personal-shield=Wzmocnij tarczę o zdolności zamrażania UV.

