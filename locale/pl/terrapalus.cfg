day-night-cycle-minutes=Czas trwania pełnego cyklu dnia/nocy w minutach.
terrapalus-elevation-scale=Reguluje wielkość wzgórz i elementów terenu. Wyższa wartość = większe elementy.
terrapalus-biome-scale=Reguluje wielkość regionów biomów. Wyższa wartość = większe biomy.
terrapalus-mud-basin-scale=Reguluje częstotliwość występowania basenów błotnych. Wyższa wartość = rzadsze występowanie.
terrapalus-lowland-size=Kontroluje rozmiar obszarów bagiennych/nizinnych na Terra Palus.
terrapalus-moisture-threshold=Próg poziomu wilgotności dla generowania terenu.
terrapalus-starting-area-multiplier=Mnożnik dla ogólnego rozmiaru obszaru startowego.
terrapalus-starting-distance=Odległość od punktu odrodzenia do początkowych nizin w kafelkach.
terrapalus-starting-radius=Promień początkowych obszarów nizinnych w kafelkach.
terrapalus-starting-fertile-radius=Promień początkowych pól żyznej gleby w kafelkach.
terrapalus-fertile-soil-frequency=Kontroluje częstotliwość pojawiania się pól żyznej gleby.
terrapalus-fertile-spot-radius=Promień pól żyznej gleby w kafelkach.
terrapalus-fertile-spot-spacing=Minimalna odległość między obszarami żyznej gleby w kafelkach.
terrapalus-fertile-region-size=Rozmiar regionów do generowania obszarów żyznej gleby.
terrapalus-fertile-candidate-spots=Liczba potencjalnych obszarów na region. Wyższa wartość = większa gęstość.
terrapalus-spawner-frequency=Częstotliwość pojawiania się dużych generatorów wrogów.
terrapalus-spawner-size=Współczynnik wielkości dla dużych generatorów wrogów.
terrapalus-small-spawner-frequency=Częstotliwość pojawiania się małych generatorów wrogów.
terrapalus-small-spawner-size=Współczynnik wielkości dla małych generatorów wrogów.
terrapalus-enemy-safe-zone-radius=Promień strefy bezpieczeństwa wolnej od wrogów w pobliżu punktu odrodzenia.
terrapalus-fog-opacity=Przezroczystość efektu mgły (0 = brak, 1 = pełna).
terrapalus-fog-color-r=Składowa czerwona koloru mgły (0-1).
terrapalus-fog-color-g=Składowa zielona koloru mgły (0-1).
terrapalus-fog-color-b=Składowa niebieska koloru mgły (0-1).
terrapalus-cloud-opacity=Przezroczystość efektów chmur (0 = brak, 1 = pełna).
terrapalus-cloud-color-r=Składowa czerwona koloru chmur (0-1).
terrapalus-cloud-color-g=Składowa zielona koloru chmur (0-1).
terrapalus-cloud-color-b=Składowa niebieska koloru chmur (0-1).

