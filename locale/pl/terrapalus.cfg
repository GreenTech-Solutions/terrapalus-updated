[technology-description]
planet-discovery-terrapalus=Mroczny, wilgotny księżyc z niekończącymi się bagnami, kąsaczami, pięcionogami i rudą palusium.
palusium-processing=Palusium jest przetwarzane w piecu na płyty palusiumowe.
palusium-crushing=Rudę palusium można rozdrobnić na proszek palusium.
palusium-liquefaction=Proszek palusium należy wymieszać z wodą i olejem, aby uzyskać ultravium.
palusium-refining=Proszek palusium należy poddać rafinacji, aby uzyskać kryształy palusium.
inhibitor-lamp=Wykorzystaj właściwości UV kryształów palusium, aby unieruchomić wrogów.
inhibitor-lamp-mk2=Lampa inhibitorowa o zwiększonym zasięgu z promieniem zamrożenia zwiększonym o 40%.
inhibitor-lamp-mk3=Lampa inhibitorowa o maksymalnym zasięgu z promieniem zamrożenia zwiększonym o 80%.
inhibitor-lamp-damage=Ofensywny wariant lampy, który spowalnia wrogów o 50% i zadaje obrażenia w czasie.
uv-turret=Wieżyczki UV wykorzystują wiązki skoncentrowanego światła UV do odpierania i dezorientowania niektórych wrogów.
uv-turret-mk2=Ulepszona wieżyczka UV o zwiększonym zasięgu i większej sile rażenia.
uv-turret-mk3=Zaawansowana wieżyczka UV o maksymalnym zasięgu i niszczycielskiej sile rażenia.
uv-turret-aoe=Wieżyczka UV o obszarowym działaniu, która zadaje obrażenia wszystkim wrogom w promieniu działania wiązki.
uv-turret-chain=Wieżyczka UV zadająca obrażenia łańcuchowe, która rozprzestrzenia obrażenia na pobliskich wrogów od głównego celu.
uv-spotlight=Szybko namierzający reflektor, który zamraża wrogów na 30 sekund, a następnie przechodzi do następnego celu. Czysta kontrola tłumu.
ultravium-power-systems=Wykorzystaj energię Ultravium do ładowania zbroi wspomaganej na Terra Palus, gdzie energia słoneczna jest niedostępna.
ultravium-power-systems-2=Ulepszone systemy zasilania Ultravium z akumulatorami o większej pojemności i stacjami ładującymi o zwiększonym zasięgu.
ultravium-power-systems-3=Zaawansowane systemy zasilania Ultravium z ogniwami o maksymalnej wydajności i infrastrukturą ładowania o dużym zasięgu.
uv-personal-equipment=Zminiaturyzowana technologia UV do zbroi osobistej. Zawiera wieżyczkę obronną, która zmusza wrogów do ucieczki, oraz tarczę, która unieruchamia pobliskich przeciwników.

